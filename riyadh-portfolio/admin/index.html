<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Riyadh al kendi</title>
<style>
:root{--bg:#0B0B0D;--red:#E11D2F;--g:#9CA3AF;--s:#151518;--b:#29292F}*{box-sizing:border-box;margin:0}body{background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;line-height:1.5}
.w{max-width:960px;margin:auto;padding:24px 20px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
button,.btn{font:inherit;cursor:pointer;color:#fff;background:none;border:1px solid var(--b);border-radius:10px;padding:9px 16px;transition:.2s}button:hover{border-color:var(--red)}.p{background:var(--red);border-color:var(--red)}.sm{padding:5px 10px;font-size:12px;border-radius:8px}.on{border-color:var(--red);color:var(--red)}.dg{border-color:#7f1d1d}
input,select,textarea{width:100%;font:inherit;color:#fff;background:var(--s);border:1px solid var(--b);border-radius:10px;padding:11px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}input[type=checkbox]{width:auto}
.fm{display:grid;gap:10px;background:var(--s);border:1px solid var(--b);border-radius:16px;padding:18px;margin:14px 0}label{display:grid;gap:4px;font-size:12px;color:var(--g)}.r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--s);border:1px solid var(--b);border-radius:14px;padding:12px 16px;margin-bottom:10px}.r .t{flex:1;min-width:160px}small{color:var(--g)}.r img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.tg{display:flex;gap:8px;flex-wrap:wrap}.tb{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px}.tb svg{width:30px;height:30px;border-radius:8px}.tb.on{border-color:var(--red);color:#fff;background:rgba(225,29,47,.14)}.r img.pt{width:64px;height:36px;border-radius:8px}
.dz{border:1.5px dashed var(--b);border-radius:12px;padding:18px;text-align:center;color:var(--g);font-size:14px;cursor:copy}.dz:hover{border-color:var(--red)}
.note{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:14px 16px;color:var(--g);font-size:14px;margin-bottom:16px}#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--s);border:1px solid var(--red);border-radius:99px;padding:10px 20px;font-size:14px;display:none;z-index:9}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style></head><body><div class="w">
<div class="top"><b style="font-size:20px">Admin · Riyadh al kendi</b><span><span id="ds" style="font-size:13px;color:var(--g);margin-inline-end:8px"></span> <button id="of">Open project folder</button> <button id="oj">Open data file</button> <button class="p" id="sv">Save</button></span></div>
<div class="note" id="st">Not connected. Click <b>Open project folder</b> (Chrome/Edge) and choose the website folder — saving then writes <code>site-data.js</code> and images directly. Other browsers: Save downloads <code>site-data.js</code>; put it in the site folder.</div>
<div style="display:flex;gap:8px;margin-bottom:14px"><button id="tp" class="sm on">Projects</button><button id="tc" class="sm">Clients</button><button id="ts" class="sm">Settings</button></div>
<div id="b"></div></div><div id="toast"></div><input type="file" id="fj" accept=".js,.json" hidden>
<script src="../site-data.js"></script>
<script src="../tools.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=["Video Editing","Motion Graphics","Social Media","Visual Design"],COL=["#9a6b3c,#2a1a10","#E11D2F,#1a0508","#2563eb,#0a1226","#7c3aed,#140a26","#d97706,#1f1205"];
let D=window.SITE?structuredClone(window.SITE):empty(),dir=null,dirty=false,warn="",tab="p",ed=null,dc="";const pv={};
function empty(){return{settings:{},stats:[],projects:[],clients:[]}}
function norm(){D.settings=D.settings||{};D.projects=D.projects||[];D.clients=D.clients||[];D.stats=[0,1,2].map(i=>(D.stats||[])[i]||{v:"",l:""})}norm();
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.x);toast.x=setTimeout(()=>t.style.display="none",2800)}
const gid=u=>{const m=/^https:\/\/drive\.google\.com\/file\/d\/([\w-]{10,})\//.exec((u||"").trim());return m&&m[1]};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const parse=t=>JSON.parse(t.replace(/^\s*window\.SITE\s*=\s*/,"").replace(/;\s*$/,""));
async function openFolder(){try{const root=await showDirectoryPicker({mode:"readwrite"});let ok=false;try{await root.getFileHandle("site-data.js");ok=true}catch{}
if(!ok){toast("Wrong folder — choose the website folder that contains site-data.js (not the admin folder)");return}
dir=root;try{D=parse(await(await(await root.getFileHandle("site-data.js")).getFile()).text())}catch{D=empty()}
norm();$("#st").innerHTML="Connected ✓ — Save writes <code>site-data.js</code> and <code>img/</code>. Then upload the folder to Netlify.";dirty=false;st();R()}catch(e){if(e.name!=="AbortError")toast(e.message)}}
function openJson(f){const r=new FileReader;r.onload=()=>{try{D=parse(r.result);norm();dirty=false;st();R();toast("Loaded")}catch{toast("Invalid file")}};r.readAsText(f)}
const img=(f,w)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,w/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL("image/jpeg",.85))};i.src=u});
async function store(f,w,pre){const du=await img(f,w);if(!dir)return du;const n=pre+Date.now()+".jpg",im=await dir.getDirectoryHandle("img",{create:true}),h=await im.getFileHandle(n,{create:true}),wr=await h.createWritable();await wr.write(await(await fetch(du)).blob());await wr.close();pv["img/"+n]=du;return"img/"+n}
async function fill(){for(const el of document.querySelectorAll("img[data-p]")){const p=el.dataset.p;if(/^(data:|https?:)/.test(p))el.src=p;else if(!dir&&!pv[p])el.src="../"+p;else if(pv[p])el.src=pv[p];else if(dir)try{const parts=p.split("/");let h=dir;for(const x of parts.slice(0,-1))h=await h.getDirectoryHandle(x);el.src=pv[p]=URL.createObjectURL(await(await h.getFileHandle(parts.pop())).getFile())}catch{}}}
async function save(){const out="window.SITE = "+JSON.stringify({...D,stats:D.stats.filter(s=>s.v&&s.l)},null,2)+";\n";
if(dir){try{const h=await dir.getFileHandle("site-data.js",{create:true}),w=await h.createWritable();await w.write(out);await w.close();dirty=false;st();toast("Saved ✓ now upload the folder to Netlify")}catch(e){toast("Save failed: "+e.message)}}
else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/javascript"}));a.download="site-data.js";a.click();dirty=false;st();toast("Downloaded — replace site-data.js in your site folder, then upload")}}
let dt;function detect(u){clearTimeout(dt);const id=gid(u);if(!id||!ed||ed.manual)return;dt=setTimeout(()=>{const im=new Image;im.onload=()=>{if(!ed||ed.manual)return;const o=im.naturalHeight>im.naturalWidth?"v":"h";if(ed.o.orient!==o){ed.o.orient=o;R();toast("Detected: "+(o==="v"?"vertical":"horizontal")+" video")}};im.src="https://drive.google.com/thumbnail?id="+id+"&sz=w320"},600)}
async function bfetch(u){try{const c=new AbortController,t=setTimeout(()=>c.abort(),9000),r=await fetch(u,{signal:c.signal});clearTimeout(t);if(!r.ok)return null;const b=await r.blob();return/^image\//.test(b.type)?b:null}catch{return null}}
async function jfetch(u){try{const c=new AbortController,t=setTimeout(()=>c.abort(),12000),r=await fetch(u,{signal:c.signal});clearTimeout(t);return await r.json()}catch{return null}}
// Same idea as Malloy: read the page's own preview image (Microlink), save a copy locally; fall back to unavatar.
async function grab(u){const j=await jfetch("https://api.microlink.io/?url="+encodeURIComponent(u)+"&screenshot=false&video=false&audio=false&iframe=false");
if(j&&j.status==="success"){const d=j.data||{},iu=(d.image&&d.image.url)||(d.logo&&d.logo.url);if(iu){const b=await bfetch(iu);if(b)return await store(b,240,"c-")}}
const a=avatarUrl(u);if(a){const b=await bfetch(a);if(b)return await store(b,240,"c-")}return""}
const fld=(l,k,v,t)=>`<label>${l}<input type="${t||"text"}" data-k="${k}" value="${esc(v)}"></label>`;
const L=()=>tab==="p"?"projects":"clients";
const toForm=p=>({...p,te:p.title?.en||"",ta:p.title?.ar||"",de:p.description?.en||"",da:p.description?.ar||""});
function form(){const o=ed.o,isP=tab==="p",k=isP?"thumb":"img",pr=o[k]?`<img data-p="${esc(o[k])}" style="height:72px;${isP?"border-radius:10px":"width:72px;border-radius:50%"};object-fit:cover">`:"";
return`<div class="fm"><b>${ed.i==null?"New":"Edit"} ${isP?"project":"client"}</b>`+(isP?`<div class="g2">${fld("Title (English)","te",o.te)}${fld("Title (Arabic)","ta",o.ta)}</div>${fld("Google Drive link (Anyone with the link · Viewer)","driveUrl",o.driveUrl)}<div class="g2">${fld("Description (English)","de",o.de)}${fld("Description (Arabic)","da",o.da)}</div><small>Video format</small><div class="tg"><button type="button" class="tb ${o.orient==='v'?"on":""}" data-a="orient" data-v="v">▯ Vertical 9:16 (Reels)</button><button type="button" class="tb ${o.orient!=='v'?"on":""}" data-a="orient" data-v="h">▭ Horizontal 16:9</button></div><small>Tools used in this project</small><div class="tg">${Object.entries(window.TOOLS||{}).map(([k,t])=>`<button type="button" class="tb ${(o.tools||[]).includes(k)?"on":""}" data-a="tool" data-t="${k}">${t.svg}${t.n}</button>`).join("")}</div>`:fld("Client / company name","name",o.name)+fld("Link (Instagram, YouTube…)","url",o.url))+
(isP?"":`<div class="dz" id="dz">📋 Fastest: on their Instagram right-click the profile picture → <b>Copy image</b>, then press <b>Ctrl+V</b> here (or drop an image on this box)</div><small>If you skip this, the picture is fetched from the link when you save (the page’s preview image, saved as a local copy). Instagram sometimes blocks it.</small>${o.img?"":(avatarUrl(o.url||"")?`<img src="${avatarUrl(o.url)}" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover" onerror="this.remove()">`:"")}<label>Profile picture / logo (optional)<input type="file" accept="image/*" data-f="${k}"></label>${pr}`)+(isP?`<label><input type="checkbox" data-k="published" ${o.published!==false?"checked":""}> Published</label><label><input type="checkbox" data-k="featured" ${o.featured?"checked":""}> Featured</label>`:"")+`<div><button class="p" data-a="ok">Save item</button> <button data-a="cancel">Cancel</button></div></div>`}
function R(){["p","c","s"].forEach(k=>$("#t"+k).classList.toggle("on",tab===k));let h="";
const dl=i=>`<button class="sm dg" data-a="del" data-i="${i}">${dc===L()+i?"Confirm delete?":"Delete"}</button>`,mv=i=>`<button class="sm" data-a="up" data-i="${i}">↑</button><button class="sm" data-a="dn" data-i="${i}">↓</button><button class="sm" data-a="edit" data-i="${i}">Edit</button>`;
if(tab==="s")h=`<div class="fm"><b>Contact links</b>${fld("Email","s.email",D.settings.email)}${fld("WhatsApp (with country code)","s.whatsapp",D.settings.whatsapp)}${fld("Instagram URL","s.instagram",D.settings.instagram)}${fld("Behance URL","s.behance",D.settings.behance)}${fld("LinkedIn URL","s.linkedin",D.settings.linkedin)}</div><div class="fm"><b>Stats (hidden until filled — only real numbers)</b>${D.stats.map((s,i)=>`<div class="g2"><input data-k="st.${i}.v" value="${esc(s.v)}" placeholder="+50"><input data-k="st.${i}.l" value="${esc(s.l)}" placeholder="Projects"></div>`).join("")}</div>`;
else if(ed)h=form();
else h=`<button class="p" data-a="new">+ Add ${tab==="p"?"project":"client"}</button><div style="height:14px"></div>`+(tab==="p"?D.projects.map((p,i)=>`<div class="r">${(()=>{const id=gid(p.driveUrl);return id?`<img class="pt" src="https://drive.google.com/thumbnail?id=${id}&amp;sz=w160" alt="" onerror="this.remove()">`:""})()}<span class="t"><b>${esc(p.title?.en||p.title?.ar)}</b><br><small>${p.orient==="v"?"Vertical":"Horizontal"} · ${p.driveUrl?"Drive linked":"no video yet"}</small></span><button class="sm ${p.published!==false?"on":""}" data-a="pub" data-i="${i}">${p.published!==false?"Published":"Draft"}</button><button class="sm ${p.featured?"on":""}" data-a="feat" data-i="${i}">★</button>${mv(i)}${dl(i)}</div>`).join("")||"<p><small>No projects.</small></p>":D.clients.map((c,i)=>`<div class="r">${c.img?`<img data-p="${esc(c.img)}">`:(avatarUrl(c.url||"")?`<img src="${avatarUrl(c.url)}" onerror="this.remove()">`:"")}<span class="t"><b>${esc(c.name)}</b><br><small>${esc(c.url||"no link")}</small></span>${mv(i)}${dl(i)}</div>`).join("")||"<p><small>No clients yet.</small></p>");
$("#b").innerHTML=h;fill()}
$("#b").oninput=e=>{const k=e.target.dataset.k;if(!k)return;const v=e.target.type==="checkbox"?e.target.checked:e.target.value;
if(ed){ed.o[k]=v;if(k==="driveUrl")detect(v)}else if(k.startsWith("st.")){const[,i,f]=k.split(".");D.stats[i][f]=v}else if(k.startsWith("s."))D.settings[k.slice(2)]=v};
$("#b").onchange=async e=>{const t=e.target;if(!ed&&t.dataset.k){dirty=true;if(dir)await save();else st();return}
if(t.type==="file"&&t.files[0]&&ed){ed.o[t.dataset.f]=await store(t.files[0],t.dataset.f==="thumb"?640:240,t.dataset.f==="thumb"?"t-":"c-");R()}};
$("#b").onclick=async e=>{const a=e.target.closest("[data-a]");if(!a)return;const x=a.dataset.a,i=+a.dataset.i,l=L();
if(x==="new")ed={i:null,o:tab==="p"?{published:true,orient:"h",g:COL[D.projects.length%5]}:{}};
else if(x==="edit")ed={i,o:tab==="p"?toForm(D.projects[i]):{...D.clients[i]},manual:tab==="p"&&!!D.projects[i].orient};
else if(x==="cancel")ed=null;
else if(x==="orient"){ed.o.orient=a.dataset.v;ed.manual=true}
else if(x==="tool"){const t=ed.o.tools=ed.o.tools||[],j=t.indexOf(a.dataset.t);j<0?t.push(a.dataset.t):t.splice(j,1)}
else if(x==="pub")D.projects[i].published=D.projects[i].published===false;
else if(x==="feat")D.projects[i].featured=!D.projects[i].featured;
else if(x==="up"&&i>0)[D[l][i-1],D[l][i]]=[D[l][i],D[l][i-1]];
else if(x==="dn"&&i<D[l].length-1)[D[l][i+1],D[l][i]]=[D[l][i],D[l][i+1]];
else if(x==="del"){if(dc===l+i){D[l].splice(i,1);dc=""}else dc=l+i}
else if(x==="ok"){const o=ed.o;let item;warn="";
if(tab==="p"){if(!(o.te||o.ta)){toast("Title is required");return}let u=o.driveUrl||"";if(u){const id=gid(u);if(!id){toast("Invalid Google Drive link");return}u="https://drive.google.com/file/d/"+id+"/view"}
const {te,ta,de,da,role,software,thumb,...rest}=o;item={...rest,id:o.id||(slug(te||"project")||"project")+"-"+Math.random().toString(36).slice(2,6),title:{en:te||ta,ar:ta||te},description:{en:de||"",ar:da||""},driveUrl:u,orient:o.orient==="v"?"v":"h",published:o.published!==false,featured:!!o.featured}}
else{if(!o.name){toast("Name is required");return}if(o.url&&!/^https?:\/\//.test(o.url)){toast("Link must start with https://");return}if(!o.img&&o.url){toast("Fetching picture…");o.img=await grab(o.url);if(!o.img)warn="Couldn’t fetch the picture now — the site will try loading it live"}item=o}
if(ed.i==null)D[l].push(item);else D[l][ed.i]=item;ed=null;toast(warn||"Item updated — press Save to write the file")}
if(["ok","del","pub","feat","up","dn"].includes(x)){dirty=true;R();if(dir)await save();else st();if(warn){toast(warn);warn=""}return}
R()};
$("#tp").onclick=()=>{tab="p";ed=null;dc="";R()};$("#tc").onclick=()=>{tab="c";ed=null;dc="";R()};$("#ts").onclick=()=>{tab="s";ed=null;R()};
$("#of").onclick=()=>window.showDirectoryPicker?openFolder():toast("This browser can’t open folders — use Chrome/Edge or “Open data file”");
$("#oj").onclick=()=>$("#fj").click();$("#fj").onchange=e=>e.target.files[0]&&openJson(e.target.files[0]);$("#sv").onclick=save;R();st();
function st(){const e=$("#ds");e.textContent=dir?(dirty?"● Unsaved changes":"✓ Saved to site-data.js"):(dirty?"● Unsaved (not connected)":"Not connected");e.style.color=dirty?"#f59e0b":dir?"#4ade80":""}
async function takeImg(f){if(!ed||tab!=="c"||!f||!/^image\//.test(f.type))return;ed.o.img=await store(f,240,"c-");R();toast("Picture added ✓")}
document.addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])][0];if(f&&ed&&tab==="c"){e.preventDefault();takeImg(f)}});
$("#b").addEventListener("dragover",e=>{if(e.target.closest("#dz"))e.preventDefault()});
$("#b").addEventListener("drop",e=>{if(e.target.closest("#dz")){e.preventDefault();takeImg(e.dataTransfer.files[0])}});
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
</script></body></html>
